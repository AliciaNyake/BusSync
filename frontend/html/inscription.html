<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/inscription.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <title>Inscription</title>
</head>
<body>

  <header id="entete">
    <h1>BusSync</h1>

    <nav>
      <div id="liens">
        <div><a href="../html/index.html">Accueil</a></div>
        <div><a href="passagers.html">Passagers</a></div>
        <div><a href="connexion.html">Connexion</a></div>
      </div>
    </nav>

    <style>
      #liens {
        margin-left: 600px;
      }
    </style>
  </header>

  <main>
    <form id="registerForm">
      <h2><strong>Inscription</strong></h2>

      <div>
        <h3 id="NOM"><strong>NOM COMPLET</strong></h3>
        <h2 id="nom">
          <input id="fullname" type="text" placeholder="Nom complet" required>
        </h2>
      </div>

      <style>
        #NOM {
          color: #1A1A1A;
        }
      </style>

      <div>
        <h3 id="AD"><strong>ADRESSE E-MAIL</strong></h3>
        <h2 id="adresse">
          <input id="email" type="email" placeholder="Adresse e-mail" required>
        </h2>
      </div>

      <style>
        #AD {
          color: #1A1A1A;
        }
      </style>

      <div>
        <h3 id="MDP"><strong>MOT DE PASSE</strong></h3>
        <h2 id="mdp">
          <input id="password" type="password" placeholder="Créez votre mot de passe" required>
        </h2>
      </div>

      <style>
        #MDP {
          color: #1A1A1A;
        }
      </style>

      <p id="message" style="color:#a93226; font-weight:bold;"></p>

      <em>
        <h5>Vous avez déjà un compte ?
          <span><a href="connexion.html">connectez vous !</a></span>
        </h5>
      </em>

      <button
        type="submit"
        style="display:inline-block; text-decoration:none; color:#FFFF; font-family:'Syne',sans-serif; font-weight:800; border:1px solid #a93226; padding:10px 28px; background-color:#a93226; border-radius:8px; cursor:pointer;">
        Valider
      </button>
    </form>
  </main>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const fullname = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      message.textContent = "";

      if (!fullname || !email || !password) {
        message.style.color = "#a93226";
        message.textContent = "Veuillez remplir tous les champs.";
        return;
      }

      try {
        const data = await apiPost("/register", {
          email: email,
          password: password
        });

        if (data.status === "OK") {
          message.style.color = "green";
          message.textContent = "Inscription réussie ! Redirection...";

          setTimeout(() => {
            window.location.href = "connexion.html";
          }, 1200);
        } else {
          message.style.color = "#a93226";
          message.textContent = data.msg || "Erreur lors de l'inscription.";
        }
      } catch (err) {
        message.style.color = "#a93226";
        message.textContent = "Impossible de contacter le serveur.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
