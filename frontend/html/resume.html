<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Résumé</title>
  <link rel="stylesheet" href="../css/resume.css">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <header>
    <h1>BusSync</h1>
  </header>

  <main>
    <h2><strong>Résumé de la réservation</strong></h2>

    <div id="resume-card" style="border:1px solid #ddd; border-radius:12px; padding:20px; background:#fff; margin-bottom:20px;">
      <h3 id="trajet-text">Chargement du trajet...</h3>

      <div>
        <h3 id="passagers-text">Passagers : ...</h3>
        <h3 id="sieges-text">Siège : ...</h3>
        <h3 id="prix-base-text">Prix unitaire : ...</h3>
        <h3 id="prix-total-text">Prix total : ...</h3>
      </div>
    </div>

    <p id="resume-message" style="font-weight:bold; color:#a93226;"></p>

    <button
      id="confirm-btn"
      style="color:#FFFF; font-family:'Syne',sans-serif; font-weight:800; border:1px solid #a93226; padding:10px 28px; background-color:#a93226; border-radius:8px; cursor:pointer;">
      Confirmer
    </button>
  </main>

  <script src="../js/app.js"></script>
  <script>
    window.addEventListener('error', function (e) {
      console.error('Erreur JS:', e.message);
    });

    var booking = JSON.parse(sessionStorage.getItem('booking') || 'null');
    var session = JSON.parse(sessionStorage.getItem('session') || 'null');

    var trajetText = document.getElementById('trajet-text');
    var passagersText = document.getElementById('passagers-text');
    var siegesText = document.getElementById('sieges-text');
    var prixBaseText = document.getElementById('prix-base-text');
    var prixTotalText = document.getElementById('prix-total-text');
    var msg = document.getElementById('resume-message');
    var btn = document.getElementById('confirm-btn');

    if (!session) {
      window.location.href = 'connexion.html';
    }

    if (!booking) {
      window.location.href = 'index.html';
    }

    function safeText(value, fallback) {
      return value ? value : fallback;
    }

    function computeTotalPrice(booking) {
      var prixBase = Number(booking.trip_price || 0);

      var adultes = 0;
      var enfants = 0;
      var bebes = 0;

      if (booking.passagers) {
        adultes = Number(booking.passagers.adult || 0);
        enfants = Number(booking.passagers.child || 0);
        bebes = Number(booking.passagers.baby || 0);
      }

      // Exemple de logique :
      // adulte = plein tarif
      // enfant = demi-tarif
      // bébé = gratuit
      var total = (adultes * prixBase) + (enfants * prixBase * 0.5);

      // Si jamais aucune donnée passager n'existe, on garde au moins 1 billet
      if (adultes === 0 && enfants === 0 && bebes === 0) {
        total = prixBase;
      }

      return total;
    }

    function renderSummary() {
      if (!booking) {
        trajetText.textContent = 'Aucune réservation trouvée.';
        passagersText.textContent = '';
        siegesText.textContent = '';
        prixBaseText.textContent = '';
        prixTotalText.textContent = '';
        btn.disabled = true;
        return;
      }

      var totalPassagers = 0;
      var adultes = 0;
      var enfants = 0;
      var bebes = 0;

      if (booking.passagers) {
        adultes = Number(booking.passagers.adult || 0);
        enfants = Number(booking.passagers.child || 0);
        bebes = Number(booking.passagers.baby || 0);
        totalPassagers = adultes + enfants + bebes;
      }

      if (totalPassagers < 1) {
        totalPassagers = 1;
      }

      trajetText.textContent =
        safeText(booking.depart, 'Départ') +
        (booking.heure ? ', ' + booking.heure : '') +
        ' → ' +
        safeText(booking.arrivee, 'Arrivée') +
        (booking.trip_date ? ', ' + booking.trip_date : '');

      passagersText.textContent =
        'Passagers : ' + totalPassagers +
        ' (adultes: ' + adultes + ', enfants: ' + enfants + ', bébés: ' + bebes + ')';

      siegesText.textContent =
        'Siège : ' +
        (booking.seats && booking.seats.length
          ? booking.seats.join(', ')
          : safeText(booking.seat_no, 'Non sélectionné'));

      var prixBase = Number(booking.trip_price || 0);
      var totalPrix = computeTotalPrice(booking);

      prixBaseText.textContent =
        'Prix unitaire : ' + (prixBase ? prixBase.toFixed(2) + ' €' : 'Non disponible');

      prixTotalText.textContent =
        'Prix total : ' + (totalPrix ? totalPrix.toFixed(2) + ' €' : 'Non disponible');
    }

    btn.addEventListener('click', async function () {
      msg.textContent = '';

      if (!session || !session.token) {
        msg.textContent = "Vous devez être connecté pour confirmer.";
        return;
      }

      if (!booking || !booking.trip_id || !booking.seat_no) {
        msg.textContent = "Informations de réservation incomplètes.";
        return;
      }

      btn.textContent = "Confirmation...";
      btn.disabled = true;

      try {
        const data = await apiPost('/book', {
          trip_id: booking.trip_id,
          seat_no: booking.seat_no
        }, session.token);

        if (data.status === 'OK') {
          booking.reservation_id = data.reservation_id;
          booking.email_sent = data.email_sent;

          sessionStorage.setItem('booking', JSON.stringify(booking));
          window.location.href = 'confirmation.html';
          return;
        } else {
          msg.textContent = data.msg || "Erreur lors de la réservation.";
        }
      } catch (err) {
        console.error(err);
        msg.textContent = "Impossible de contacter le serveur.";
      }

      btn.textContent = "Confirmer";
      btn.disabled = false;
    });

    renderSummary();
  </script>
</body>
</html>
