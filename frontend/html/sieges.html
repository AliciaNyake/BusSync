<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BusSync — Sièges</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/sieges.css" />
</head>
<body>

  <nav>
    <a class="logo" href="../index.html">BusSync</a>
    <ul class="nav-links" id="nav-links"></ul>
  </nav>

  <div class="stepper" id="stepper"></div>

  <div class="main-wide">
    <div class="section-head">
      <h1>Choix des sièges</h1>
      <p id="sieges-subtitle">Sélectionnez vos places</p>
    </div>

    <div class="seat-layout">
      <div class="legend-card">
        <p class="legend-title">Légende</p>
        <div class="legend-item"><div class="legend-box available"></div><span class="legend-text">Disponible</span></div>
        <div class="legend-item"><div class="legend-box taken"></div><span class="legend-text">Réservé</span></div>
        <div class="legend-item"><div class="legend-box selected"></div><span class="legend-text">Votre sélection</span></div>
        <div class="legend-item"><div class="legend-box driver"></div><span class="legend-text">Conducteur</span></div>
        <div style="margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--border);">
          <p style="font-size:0.78rem;color:var(--muted);line-height:1.6;font-weight:300;">
            Modifiez votre choix à tout moment avant la confirmation.
          </p>
        </div>
      </div>

      <div class="bus-card">
        <div class="bus-front">↑ Avant du bus</div>
        <div class="seat-grid" id="seat-grid"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="selection-info">
        <span>Places sélectionnées</span>
        <strong id="selected-label">Aucune place sélectionnée</strong>
      </div>
      <button class="btn-continue" id="btn-validate" disabled onclick="handleValidate()">
        Valider →
      </button>
    </div>
  </div>

  <script src="../js/app.js"></script>
  <script>
    var session = JSON.parse(sessionStorage.getItem('session') || 'null');
    var booking = JSON.parse(sessionStorage.getItem('booking') || 'null');

    if (!session) {
      window.location.href = 'connexion.html';
    } else if (!booking) {
      window.location.href = '../index.html';
    } else {
      var navEl = document.getElementById('nav-links');
      navEl.innerHTML =
        '<li><a href="../index.html">Accueil</a></li>' +
        '<li><div class="user-badge"><div class="user-avatar">' + (session.initials || 'U') + '</div>' +
        '<span class="user-name">' + (session.name || 'Utilisateur') + '</span></div></li>' +
        '<li><button class="btn-logout" onclick="logout()">Déconnexion</button></li>';

      if (typeof buildStepper === "function") {
        buildStepper('stepper', booking, 3);
      }

      document.getElementById('sieges-subtitle').textContent =
        'Sélectionnez vos places pour ' + booking.depart + ' → ' + booking.arrivee;

      var ROWS = 10;
      var COLS = 4;
      var selectedSeats = new Set();

      var pax = booking.passagers || { adult: 1, child: 0, baby: 0 };
      var maxSelect = (pax.adult || 0) + (pax.child || 0);

      // Si seulement des bébés, on force au moins 1 place adulte
      if (maxSelect < 1) maxSelect = 1;

      function logout() {
        sessionStorage.clear();
        window.location.href = '../index.html';
      }

      async function init() {
        var bookedSet = new Set();

        try {
          // Récupérer le trajet depuis le backend
          var from = encodeURIComponent(booking.depart);
          var to = encodeURIComponent(booking.arrivee);

          var tripsData = await apiGet('/trips?from=' + from + '&to=' + to);

          if (tripsData.status === 'OK' && tripsData.trips && tripsData.trips.length > 0) {
            // On prend le premier trajet retourné
            booking.trip_id = tripsData.trips[0].id;
            booking.trip_price = tripsData.trips[0].price;
            booking.trip_date = tripsData.trips[0].date;
            booking.trip_seat_count = tripsData.trips[0].seat_count;

            sessionStorage.setItem('booking', JSON.stringify(booking));
          }

          // Ton backend actuel n'a pas /trips/{id}/seats
          // Donc on affiche un plan de sièges avec quelques sièges déjà pris en démo
          [3, 5, 6].forEach(function(n) { bookedSet.add(n); });

        } catch (e) {
          console.error(e);
          // fallback démo
          [3, 5, 6].forEach(function(n) { bookedSet.add(n); });
        }

        buildSeatGrid(bookedSet);
        updateSeatLabel();
      }

      function buildSeatGrid(bookedSet) {
        var grid = document.getElementById('seat-grid');
        grid.innerHTML = '';

        var labels = 'ABCD';

        for (var r = 0; r < ROWS; r++) {
          var row = document.createElement('div');
          row.className = 'seat-row';

          for (var c = 0; c < COLS; c++) {
            if (c === 2) {
              var aisle = document.createElement('div');
              aisle.className = 'aisle';
              row.appendChild(aisle);
            }

            var gridId = r + '-' + c;
            var seatNo = r * 4 + c + 1;

            var seat = document.createElement('div');
            seat.className = 'seat';
            seat.textContent = (r + 1) + labels[c];
            seat.dataset.seatNo = seatNo;

            if (r === 0 && c === 0) {
              seat.classList.add('driver');
              seat.textContent = '🚌';
            } else if (bookedSet.has(seatNo)) {
              seat.classList.add('taken');
            } else {
              (function(gid, el, num) {
                el.addEventListener('click', function() {
                  toggleSeat(gid, el, num);
                });
              })(gridId, seat, seatNo);
            }

            row.appendChild(seat);
          }

          grid.appendChild(row);
        }
      }

      function toggleSeat(gridId, el, seatNo) {
        if (selectedSeats.has(gridId)) {
          selectedSeats.delete(gridId);
          el.classList.remove('selected');
        } else {
          if (selectedSeats.size >= maxSelect) return;
          selectedSeats.add(gridId);
          el.classList.add('selected');
        }

        updateSeatLabel();
      }

      function updateSeatLabel() {
        var label = document.getElementById('selected-label');
        var btn = document.getElementById('btn-validate');

        if (selectedSeats.size === 0) {
          label.textContent = 'Aucune place sélectionnée';
          btn.disabled = true;
        } else {
          var names = Array.from(selectedSeats).map(function(gid) {
            var parts = gid.split('-').map(Number);
            return (parts[0] + 1) + 'ABCD'[parts[1]];
          });

          label.textContent =
            names.join(', ') + ' — ' + selectedSeats.size + '/' + maxSelect + ' places';

          btn.disabled = selectedSeats.size < maxSelect;
        }
      }

      function gridIdToSeatNo(gid) {
        var parts = gid.split('-').map(Number);
        return parts[0] * 4 + parts[1] + 1;
      }

      window.handleValidate = function() {
        if (selectedSeats.size === 0) return;

        var seatNumbers = Array.from(selectedSeats).map(gridIdToSeatNo);
        var seatLabels = Array.from(selectedSeats).map(function(gid) {
          var parts = gid.split('-').map(Number);
          return (parts[0] + 1) + 'ABCD'[parts[1]];
        });

        booking.seat_no = seatNumbers[0];     // backend actuel réserve 1 siège à la fois
        booking.seats = seatLabels;           // pour affichage
        booking.selected_seat_numbers = seatNumbers;

        sessionStorage.setItem('booking', JSON.stringify(booking));
        window.location.href = 'resume.html';
      };

      init();
    }
  </script>
</body>
</html>
